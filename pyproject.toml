[project]
name = "ml-proj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "baraa barkat", email = "braa.barkat2004@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "great-expectations>=1.24.1",
    "joblib>=1.6.0",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas==2.2.3",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
ml-proj = "ml_proj:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
